name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  sample-app:
    name: Validate sample application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sample-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: sample-app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  orchestrator:
    name: Validate orchestrator
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json

      - name: Install validation sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Permit namespace creation only for bwrap on the disposable runner.
          # Keep Ubuntu's system-wide unprivileged-userns restriction enabled.
          sudo tee /etc/apparmor.d/run4-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile run4-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/run4-bwrap
      - name: Verify sandbox namespaces
        run: >-
          bwrap --unshare-user --unshare-pid --unshare-net
          --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib
          --ro-bind-try /lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
